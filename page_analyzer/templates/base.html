<!DOCTYPE html>
<html lang="ru" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализатор страниц</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column h-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container justify-content-start gap-4">
            <a class="navbar-brand" href="{{ url_for('index') }}">Анализатор страниц</a>
            <a class="nav-link text-secondary" href="{{ url_for('urls_get') }}">Сайты</a>
        </div>
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} mb-0 rounded-0" role="alert">
                    <div class="container">{{ message }}</div>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <main class="container mt-5 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-3 mt-auto">
        <a href="https://hexlet.io" class="text-muted">Hexlet</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
