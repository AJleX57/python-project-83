<!DOCTYPE html>
<html lang="ru" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализатор страниц</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column h-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Анализатор страниц</a>
            <div class="navbar-nav">
                <a class="nav-link text-secondary" href="/urls">Сайты</a>
            </div>
        </div>
    </nav>

    <main class="container mt-5 flex-grow-1">
        <div class="card mx-auto" style="max-width: 600px;">
            <div class="card-body p-5">
                <h1 class="card-title text-center mb-3">Анализатор страниц</h1>
                <p class="text-center text-muted mb-4">Бесплатно проверяйте сайты на SEO-пригодность</p>
                <form action="/urls" method="post">
                    <div class="input-group">
                        <input
                            type="text"
                            name="url"
                            class="form-control"
                            placeholder="https://www.example.com"
                        >
                        <button type="submit" class="btn btn-primary">ПРОВЕРИТЬ</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="text-center py-3 mt-auto">
        <a href="https://hexlet.io" class="text-muted">Hexlet</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
