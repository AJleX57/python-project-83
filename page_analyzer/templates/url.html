{% extends 'base.html' %}

{% block content %}
<h1 class="mb-3">Сайт: {{ url[1] }}</h1>

<table class="table" data-test="url">
    <tbody>
        <tr>
            <td>ID</td>
            <td>{{ url[0] }}</td>
        </tr>
        <tr>
            <td>Имя</td>
            <td>{{ url[1] }}</td>
        </tr>
        <tr>
            <td>Дата создания</td>
            <td>{{ url[2] }}</td>
        </tr>
    </tbody>
</table>

<h2 class="mt-4 mb-3">Проверки</h2>

<form action="{{ url_for('url_check', id=url[0]) }}" method="post">
    <button type="submit" class="btn btn-primary mb-3">Запустить проверку</button>
</form>

<table class="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Код ответа</th>
            <th>h1</th>
            <th>title</th>
            <th>description</th>
            <th>Дата создания</th>
        </tr>
    </thead>
    <tbody>
    </tbody>
</table>
{% endblock %}
